<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Links — Support Team Launcher</title>
    <meta
      name="description"
      content="One launcher for every tool the support team uses daily: Okta, Slack, NICE, Superpunch, Sidd and shared docs."
    />
    <meta property="og:title" content="Quick Links — Support Team Launcher" />
    <meta
      property="og:description"
      content="One launcher for every tool the support team uses daily: Okta, Slack, NICE, Superpunch, Sidd and shared docs."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="public/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --radius: 1rem;
        --background: oklch(0.19 0.03 250);
        --foreground: oklch(0.97 0.008 250);
        --card: oklch(0.24 0.032 252);
        --card-foreground: oklch(0.97 0.008 250);
        --primary: oklch(0.78 0.16 168);
        --primary-foreground: oklch(0.19 0.03 250);
        --secondary: oklch(0.29 0.035 252);
        --secondary-foreground: oklch(0.97 0.008 250);
        --muted: oklch(0.29 0.035 252);
        --muted-foreground: oklch(0.72 0.02 250);
        --accent: oklch(0.72 0.15 55);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 14%);
        --ring: oklch(0.78 0.16 168);
        --font-sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
        --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        --surface-glow: radial-gradient(
            900px circle at 10% -10%,
            color-mix(in oklab, var(--primary) 18%, transparent),
            transparent 60%
          ),
          radial-gradient(
            700px circle at 95% 0%,
            color-mix(in oklab, var(--accent) 16%, transparent),
            transparent 55%
          );
        --gradient-card: linear-gradient(
          150deg,
          color-mix(in oklab, var(--card) 92%, white 8%),
          var(--card)
        );
        --shadow-tile: 0 18px 40px -20px oklch(0 0 0 / 70%);
        --shadow-tile-hover: 0 26px 60px -22px
          color-mix(in oklab, var(--primary) 45%, transparent);
      }

      * {
        box-sizing: border-box;
        border-color: var(--border);
      }

      body {
        margin: 0;
        background-color: var(--background);
        background-image: var(--surface-glow);
        background-attachment: fixed;
        color: var(--foreground);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2 {
        font-family: var(--font-display);
        letter-spacing: -0.02em;
        margin: 0;
      }

      main {
        max-width: 64rem;
        margin: 0 auto;
        min-height: 100vh;
        width: 100%;
        padding: 4rem 1.5rem;
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      @media (min-width: 640px) {
        header {
          flex-direction: row;
          align-items: flex-end;
          justify-content: space-between;
        }
      }

      .eyebrow {
        font-size: 0.75rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--primary);
        margin: 0;
      }
      h1 {
        margin-top: 0.5rem;
        font-size: 2.5rem;
        font-weight: 700;
        line-height: 1.05;
      }
      @media (min-width: 640px) {
        h1 {
          font-size: 3rem;
        }
      }
      .subhead {
        margin-top: 0.75rem;
        max-width: 28rem;
        font-size: 0.875rem;
        color: var(--muted-foreground);
      }


      .groups {
        margin-top: 3.5rem;
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      .group-head {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .group-head h2 {
        font-size: 0.875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        color: var(--muted-foreground);
      }
      .group-head .rule {
        height: 1px;
        flex: 1;
        background: var(--border);
      }
      .group-head .count {
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }

      .grid {
        margin-top: 1.25rem;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
      }
      @media (min-width: 640px) {
        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (min-width: 1024px) {
        .grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }

      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        border-radius: 1rem;
        border: 1px solid var(--border);
        padding: 1.25rem;
        text-decoration: none;
        background-image: var(--gradient-card);
        box-shadow: var(--shadow-tile);
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1),
          box-shadow 220ms ease, border-color 220ms ease;
      }
      .tile:hover {
        transform: translateY(-6px);
        box-shadow: var(--shadow-tile-hover);
        border-color: color-mix(in oklab, var(--primary) 45%, transparent);
      }
      .tile:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--ring);
      }
      .tile .iconwrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.75rem;
        background: var(--secondary);
        color: var(--primary);
        transition: background-color 220ms ease, color 220ms ease;
      }
      .tile:hover .iconwrap {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .tile .name {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        color: var(--card-foreground);
      }
      .tile .blurb {
        margin-top: 0.125rem;
        display: block;
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      .tile .arrow {
        position: absolute;
        right: 1rem;
        top: 1rem;
        color: var(--muted-foreground);
        opacity: 0;
        transition: opacity 220ms ease;
      }
      .tile:hover .arrow {
        opacity: 1;
      }

      .controls {
        display: flex;
        align-items: flex-end;
      }
      .regionbar {
        display: inline-flex;
        gap: 0.25rem;
        padding: 0.25rem;
        border: 1px solid var(--input);
        background: var(--card);
        border-radius: 0.75rem;
      }
      .region {
        border: 0;
        background: transparent;
        color: var(--muted-foreground);
        font: inherit;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 0.375rem 0.75rem;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      .region.active {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .tile.pending {
        border-style: dashed;
        opacity: 0.6;
        cursor: not-allowed;
      }
      .tile.pending:hover {
        transform: none;
        box-shadow: var(--shadow-tile);
        border-color: var(--border);
      }
      .pendingtag {
        position: absolute;
        right: 1rem;
        top: 1rem;
        font-size: 0.625rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted-foreground);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Support workspace</p>
          <h1>Quick Links</h1>
          <p class="subhead">
            Every tool your shift needs, one click away. Links open in a new tab.
          </p>
        </div>
        <div class="controls">
          <div class="regionbar" id="regions"></div>
        </div>
      </header>

      <div class="groups" id="groups"></div>
    </main>

    <script>
      const REGIONS = ["AU", "UK", "US", "CA"];
      const REGION_LABEL = { AU: "Australia", UK: "United Kingdom", US: "United States", CA: "Canada" };
      const GURU_LINKS = {
        AU: "https://docs.google.com/document/d/1KBsw-ZyJhb3pVO8MN2kbA_5cZIhzwmhSO8peNADIeec/edit?usp=sharing",
        UK: null,
        US: null,
        CA: null,
      };
      let region = "AU";

      const BASE_LINKS = [
        { name: "Okta", href: "http://turo.okta.com/", icon: "key-round", group: "Systems", blurb: "Single sign-on portal" },
        { name: "Superpunch", href: "http://egypt.superpunchtms.com/", icon: "clock-4", group: "Systems", blurb: "Time & attendance" },
        { name: "Slack", href: "turo-bpo.slack.com", icon: "message-square", group: "Systems", blurb: "Team chat" },
        { name: "Gmail", href: "https://mail.google.com/mail/u/0/", icon: "mail", group: "Systems", blurb: "Email system" },
        { name: "NICE", href: "https://intouch.nicecloudsvc.com/", icon: "headphones", group: "Systems", blurb: "Schedule planner" },
        { name: "Sidd", href: "https://auth.laivly.cloud/realms/turo/protocol/openid-connect/auth?response_type=code&client_id=sidd-platform-client-prod&scope=profile offline_access&redirect_uri=sidd://oauth/redirect", icon: "sparkles", group: "Systems", blurb: "Agent assist" },
        { name: "Kustomer", href: "https://turo.kustomerapp.com/", icon: "blocks", group: "Systems", blurb: "Turo's main tickets system" },
        { name: "Gearbox", href: "https://gearbox.turo.com/", icon: "toolbox", group: "Systems", blurb: "Accounts management" },
        { name: "Uber", href: undefined, icon: "car", group: "Systems", blurb: "Customer gift cards" },
        { name: "Lyft", href: undefined, icon: "car-taxi-front", group: "Systems", blurb: "Customer gift cards" },
        { name: "Ticket Strategy", href: "https://docs.google.com/forms/d/e/1FAIpQLSd_ahMP9eNhIQ3qGhH7kJxK2pDIjMzghFPq8JxD6EiI2c26mw/viewform?pli=1", icon: "ticket-check", group: "Docs & Sheets", blurb: "Submission form" },
        { name: "VM Bucket", href: "https://docs.google.com/spreadsheets/d/1YhP8uNxhqx5d53wB0YDlXIU811t6Lz8X-226t8-OmLY/edit?gid=0#gid=0", icon: "flame", group: "Docs & Sheets", blurb: "Assigned tickets", regions: ["AU"] },
        { name: "Play Mode", href: "https://docs.google.com/spreadsheets/d/1XJ7kyRBvCHr0rxsAJ6V0OSHboK5ik9rKO5fqk_OM5g0/edit?gid=990526332#gid=990526332", icon: "gamepad-2", group: "Docs & Sheets", blurb: "Unassigned tickets", regions: ["AU"] },
      ];

      function currentLinks() {
        const visible = BASE_LINKS.filter((l) => !l.regions || l.regions.includes(region));
        const guru = {
          name: region + " Gurus",
          href: GURU_LINKS[region],
          icon: "book-open-text",
          group: "Docs & Sheets",
          blurb: REGION_LABEL[region] + " knowledge center",
        };
        return visible.concat([guru]);
      }

      const GROUPS = ["Systems", "Docs & Sheets"];
      const groupsEl = document.getElementById("groups");
      const regionEl = document.getElementById("regions");

      function renderRegions() {
        regionEl.innerHTML = "";
        REGIONS.forEach((r) => {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = r;
          b.title = REGION_LABEL[r];
          b.className = "region" + (r === region ? " active" : "");
          b.addEventListener("click", () => {
            region = r;
            renderRegions();
            render();
          });
          regionEl.appendChild(b);
        });
      }

      function render() {
        groupsEl.innerHTML = "";
        const links = currentLinks();
        GROUPS.forEach((group) => {
          const items = links.filter((l) => l.group === group);
          if (items.length === 0) return;

          const section = document.createElement("section");
          const head = document.createElement("div");
          head.className = "group-head";
          head.innerHTML =
            "<h2>" + group + "</h2><span class='rule'></span><span class='count'>" + items.length + "</span>";
          section.appendChild(head);

          const grid = document.createElement("div");
          grid.className = "grid";
          items.forEach((l) => {
            const a = document.createElement(l.href ? "a" : "div");
            a.className = "tile" + (l.href ? "" : " pending");
            if (l.href) {
              a.href = l.href;
              a.target = "_blank";
              a.rel = "noreferrer noopener";
            } else {
              a.title = "Link not set yet";
            }
            const icon = document.createElement("span");
            icon.className = "iconwrap";
            const i = document.createElement("i");
            i.setAttribute("data-lucide", l.icon);
            icon.appendChild(i);
            const text = document.createElement("span");
            text.innerHTML =
              "<span class='name'>" + l.name + "</span><span class='blurb'>" + l.blurb + "</span>";
            a.append(icon, text);
            if (l.href) {
              const arrow = document.createElement("i");
              arrow.setAttribute("data-lucide", "arrow-up-right");
              arrow.className = "arrow";
              a.appendChild(arrow);
            } else {
              const tag = document.createElement("span");
              tag.className = "pendingtag";
              tag.textContent = "Pending";
              a.appendChild(tag);
            }
            grid.appendChild(a);
          });
          section.appendChild(grid);
          groupsEl.appendChild(section);
        });

        if (window.lucide) lucide.createIcons();
      }

      renderRegions();
      render();
    </script>
  </body>
</html>
