<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Links</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 32px;
      border-radius: 10px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: #1a1a1a;
    }

    p {
      margin-top: 8px;
      color: #666;
      font-size: 14px;
    }

    .grid {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 32px;
      justify-items: center;
    }

    .app {
      text-decoration: none;
      color: #1a1a1a;
      text-align: center;
    }

    .app img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: #fff;
      padding: 8px;
      border: 1px solid #eee;
      object-fit: contain;
    }

    .label {
      margin-top: 8px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Quick Links</h1>
    <p>Click an icon to open the app</p>

    <div class="grid">
